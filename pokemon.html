    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Press+Start+2P&display=swap');

        @font-face {
            font-family: 'Pokemon Solid';
            src: url('css/Pokemon Solid.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #b51616;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(210, 92, 92, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
        }


        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 1000px;
            margin: 40px auto 40px;
        }

        .game-layout {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 30px;
            width: 100%;
        }

        .game-row {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 40px;
            width: 800px;
            height: 500px;
            padding: 40px;
            flex-shrink: 0;
        }

        .game-background {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 880px;
            height: 500px;
            border-radius: 15px;
            box-shadow:
                0 0 10px #ff6b00,
                0 0 20px #ff4500,
                0 0 30px #ff4500,
                0 0 40px #d32f2f;
            animation: fireBorder 2s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes fireBorder {
            0% {
                box-shadow:
                    0 0 10px #ff6b00,
                    0 0 20px #ff4500,
                    0 0 30px #ff4500,
                    0 0 40px #d32f2f;
            }
            100% {
                box-shadow:
                    0 0 15px #ffcb05,
                    0 0 30px #ff6b00,
                    0 0 45px #ff4500,
                    0 0 60px #d32f2f;
            }
        }

        .pokemon-display,
        .question-section {
            position: relative;
            z-index: 1;
        }

        .current-stats {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            justify-content: flex-start;
            width: 800px;
            padding-left: 50px;
        }

        .current-stat {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 12px 25px;
            border-radius: 12px;
            border: 2px solid #2152da;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .current-stat label {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        .current-stat .value {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 20px;
            color: #ffcb05;
            text-shadow: 2px 2px 0 #2152da;
        }

        .current-stat #playerName::placeholder {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 10px;
            color: #888;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .scoreboard {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 20px;
            width: 280px;
            height: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid #2152da;
            overflow-y: auto;
        }

        .scoreboard-title {
            font-family: 'Pokemon Solid', sans-serif;
            font-size: 24px;
            color: #ffcb05;
            -webkit-text-stroke: 2px #2152da;
            paint-order: stroke fill;
            text-align: center;
            margin: 0;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .leaderboard-entry {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            gap: 10px;
        }

        .leaderboard-entry.top-5 {
            background: rgba(255, 203, 5, 0.15);
            border: 1px solid rgba(255, 203, 5, 0.3);
        }

        .leaderboard-rank {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 10px;
            color: #ffcb05;
            width: 25px;
        }

        .leaderboard-flag {
            font-size: 16px;
            width: 22px;
            text-align: center;
        }

        .leaderboard-name {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 11px;
            color: white;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .leaderboard-score {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 12px;
            color: #ffcb05;
        }

        .leaderboard-streak {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 12px;
            color: #ef5350;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .streak-emoji {
            font-size: 14px;
            position: relative;                                                             
            top: -2px;
        }

        .streak-num {
            line-height: 1;
            position: relative;
        }

        .no-scores {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 9px;
            color: #666;
            text-align: center;
            padding: 20px;
        }

        .leaderboard-entry.current-player {
            background: rgba(81, 207, 102, 0.25);
            border: 2px solid #51cf66;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(81, 207, 102, 0.3); }
            50% { box-shadow: 0 0 15px rgba(81, 207, 102, 0.6); }
        }

        .question-section {
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: -10px;
            flex-shrink: 0;
        }

        .title {
            font-family: 'Pokemon Solid', sans-serif;
            font-size: 48px;
            margin: 0;
            text-align: center;
            line-height: 1.5;
            letter-spacing: 2px;
            display: inline-block;
        }

        .letter {
            display: inline-block;
            position: relative;
            color: #d6af12;
            -webkit-text-stroke: 10px #2152da;
            paint-order: stroke fill;
            text-shadow: 8px 8px 0 rgba(0,0,0,0.25);
        }

        .letter.priority {
            z-index: 2;
        }

        .letter.no-priority {
            z-index: 1;
        }

        .answer-letter {
            -webkit-text-stroke: 4px #2152da;
        }

        .big-line {
            font-size: 60px;
        }

        .question-mark {
            display: inline-block;
             /* elongation */
            transform-origin: bottom;
            position: relative;
            color: #d6af12;
            -webkit-text-stroke: 10px #2152da;
            transform: scaleX(1) scaleY(3) skewX(8deg);
            font-size: 65px;
            margin: 0 5px 0 20px;
            top: 35px;
            font-family: 'BankGothic', sans-serif;
            text-shadow: 8px 8px 0 rgba(0,0,0,0.25);
            paint-order: stroke fill;
        }

        @font-face {
        font-family: 'BankGothic';
        src: url('./css/bank\ gothic\ medium\ bt.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
        }
        

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            font-size: 20px;
            color: white;
            font-weight: bold;
        }

        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .pokemon-display {
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-shrink: 0;
            margin-left: -30px;
        }

        .pokemon-image-container {
            width: 350px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .pokemon-image {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            transition: filter 0.3s ease, transform 0.4s ease, opacity 0.4s ease;
            opacity: 1;
            transform: scale(1);
        }

        .pokemon-image.silhouette {
            filter: brightness(0);
        }

        .pokemon-image.fade-out {
            opacity: 0;
            transform: scale(0.8) rotate(10deg);
        }

        .pokemon-image.fade-in {
            animation: pokemonAppear 0.5s ease-out forwards;
        }

        @keyframes pokemonAppear {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-10deg);
            }
            50% {
                transform: scale(1.1) rotate(5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .pokemon-image.reveal {
            animation: pokemonReveal 0.6s ease-out forwards;
        }

        @keyframes pokemonReveal {
            0% {
                filter: brightness(0);
                transform: scale(1);
            }
            50% {
                filter: brightness(1.5);
                transform: scale(1.15);
            }
            100% {
                filter: brightness(1);
                transform: scale(1);
            }
        }

        .guess-section {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 15px;
            margin-left: 180px;
        }

        .guess-controls {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .guess-input {
            width: 250px;
            padding: 12px 15px;
            font-size: 10px;
            border: 3px solid #3d7dca;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: 'Press Start 2P', sans-serif;
        }

        .guess-input:focus {
            outline: none;
            border-color: #ffcb05;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 25px;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }

        .btn-submit {
            background: #ffcb05;
            color: #2152da;
        }

        .btn-skip {
            background: #ff6b6b;
            color: white;
        }

        .feedback {
            padding: 20px 25px;
            border-radius: 12px;
            font-size: 10px;
            font-family: 'Press Start 2P', sans-serif;
            text-align: center;
            min-height: 100px;
            width: 280px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid transparent;
            transition: all 0.3s ease;
            line-height: 1.5;
        }

        .feedback.visible {
            display: flex;
            flex-direction: column;
        }

        .feedback-title {
            font-size: 20px;
            font-weight: bold;
            color: #ff4444;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .feedback-title.correct-title {
            color: #ffffff;
        }

        .feedback.correct .points-earned {
            color: #fff;
        }

        .feedback-title.skipped-title {
            color: #adb5bd;
        }

        .feedback strong {
            color: #ffcb05;
            text-transform: capitalize;
            letter-spacing: 1px;
            font-size: 22px;
        }

        .guesses-left {
            font-size: 15px;
            color: #aaa;
            margin-top: 8px;
        }

        .hint-emoji {
            font-size: 50px;
            vertical-align: middle;
            margin-right: 5px;
        }

        .points-earned {
            font-size: 18px;
            font-weight: bold;
            color: #ffcb05;
            margin-top: 5px;
        }

        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .start-content {
            text-align: center;
        }

        .start-title {
            font-family: 'Pokemon Solid', sans-serif;
            font-size: 48px;
            color: #d6af12;
            -webkit-text-stroke: 10px #2152da;
            paint-order: stroke fill;
            text-shadow: 8px 8px 0 rgba(0,0,0,0.25);
            margin-bottom: 30px;
            line-height: 1.5;
            letter-spacing: 2px;
        }

        .play-button {
            background: linear-gradient(135deg, #ffcb05 0%, #f0b800 100%);
            color: #2152da;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 16px;
            padding: 18px 40px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b8860b, 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .play-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #b8860b, 0 15px 25px rgba(0,0,0,0.3);
        }

        .play-button:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b8860b, 0 5px 10px rgba(0,0,0,0.3);
        }

        .play-button i {
            margin-right: 10px;
        }

        .game-content {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
            color: white;
            border-color: #2f9e44;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            border-color: #2152da;
        }

        .feedback.skipped {
            background: linear-gradient(135deg, #495057 0%, #343a40 100%);
            color: white;
            border-color: #6c757d;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 24px;
            font-family: 'Press Start 2P', sans-serif;
        }

        .mute-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .mute-button:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .mute-button.muted {
            background: rgba(255, 107, 107, 0.5);
        }

        @media (max-width: 768px) {
            .game-row {
                flex-direction: column;
                gap: 20px;
                background-size: cover;
                padding: 20px;
                min-height: 400px;
            }

            .title {
                font-size: 24px;
            }

            .big-line {
                font-size: 32px;
            }

            .question-mark {
                font-size: 24px;
                top: -10px;
            }

            .pokemon-display {
                padding: 0;
                margin-left: 0;
            }

            .pokemon-image-container {
                width: 200px;
                height: 200px;
            }

            .btn {
                font-size: 10px;
                padding: 12px 20px;
            }

            .stats {
                gap: 15px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <button class="mute-button" id="muteButton" onclick="toggleMute()">
        <i class="fas fa-volume-up" id="volumeIcon"></i>
    </button>

    <div class="game-container">

            <div class="stat">Score: <span id="score">0</span></div>

        <div id="loading" class="loading">Loading...</div>

        <div id="game" style="display: none;">

                        <option value="🇮🇪">🇮🇪</option>
                    </select>
                </div>
            </div>
            <div class="game-layout">
                <div class="game-row">
                    <img src="assets/red_bluewhite_explosion_bgd.png" alt="" class="game-background">
                    <div id="startOverlay" class="start-overlay">
                        <div class="start-content">
                            <h2 class="start-title">WHO'S<span class="question-mark">?</span>THAT<br>PoKéMoN</h2>
                            <button class="play-button" onclick="startGame()">
                                <i class="fas fa-play"></i> Play

                        </div>
                    </div>
                    <div id="gameContent" class="game-content" style="display: none;">
                        <div class="pokemon-display">
                            <div class="pokemon-image-container">
                                <img id="pokemonImage" class="pokemon-image silhouette" src="" alt="Pokemon">
                            </div>
                        </div>
                        <div class="question-section">
                            <h1 class="title" id="questionTitle">WHO'S THAT<br>PoKéMoN</h1>
                        </div>
                    </div>
                </div>
                <div class="right-column">
                    <div class="scoreboard">
                        <h2 class="scoreboard-title">Top 5</h2>
                        <div class="leaderboard-list" id="leaderboardList">
                            <div class="no-scores">No scores yet!</div>
                        </div>
                    </div>
                    <div id="feedback" class="feedback"></div>
                </div>
            </div>

            <div class="guess-section">
                <div class="guess-controls">
                    <input type="text" id="guessInput" class="guess-input" placeholder="Enter Pokémon name..."
                        autocomplete="off">
                    <div class="buttons">
                        <button class="btn btn-skip" onclick="skipPokemon()">Skip</button>
                        <button class="btn btn-submit" onclick="submitGuess()">Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="whosThatAudio" preload="auto">
        <source src="whos_that_pokemon.mp3" type="audio/mpeg">
    </audio>

    <audio id="revealAudio" preload="auto">
        <source src="pokeball_openingv3.mp3" type="audio/mpeg">
    </audio>

    <script>
        let currentPokemon = null;
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let revealed = false;
        let isMuted = false;
        let guessesRemaining = 3;
        let shownPokemonIds = new Set(); // Track Pokemon already shown this session

        // Leaderboard functions
        function getLeaderboard() {
            const data = localStorage.getItem('pokemonLeaderboard');
            return data ? JSON.parse(data) : [];
        }

        function saveToLeaderboard(name, playerScore, playerStreak) {
            if (!name || playerScore === 0) return;

            const country = document.getElementById('playerCountry').value || '🌍';
            let leaderboard = getLeaderboard();
            leaderboard.push({ name, country, score: playerScore, streak: playerStreak, date: Date.now() });
            leaderboard.sort((a, b) => b.score - a.score || b.streak - a.streak);
            leaderboard = leaderboard.slice(0, 5);
            localStorage.setItem('pokemonLeaderboard', JSON.stringify(leaderboard));
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const leaderboard = getLeaderboard();
            const container = document.getElementById('leaderboardList');
            const playerName = document.getElementById('playerName').value.trim() || 'You';
            const playerCountry = document.getElementById('playerCountry').value || '🌍';

            // Create a combined list with current player if they have a score
            let displayList = [...leaderboard];
            let currentPlayerIndex = -1;

            if (score > 0) {
                // Add current player to the list
                const currentPlayer = {
                    name: playerName,
                    country: playerCountry,
                    score: score,
                    streak: Math.max(streak, maxStreak),
                    isCurrent: true
                };
                displayList.push(currentPlayer);
                displayList.sort((a, b) => b.score - a.score || b.streak - a.streak);
                displayList = displayList.slice(0, 10);
                currentPlayerIndex = displayList.findIndex(e => e.isCurrent);
            }

            if (displayList.length === 0) {
                container.innerHTML = '<div class="no-scores">No scores yet!</div>';
                return;
            }

            container.innerHTML = displayList.map((entry, index) => `
                <div class="leaderboard-entry ${index < 3 ? 'top-3' : ''} ${entry.isCurrent ? 'current-player' : ''}">
                    <span class="leaderboard-rank">${index + 1}.</span>
                    <span class="leaderboard-flag">${entry.country || '🌍'}</span>
                    <span class="leaderboard-name">${entry.name}${entry.isCurrent ? ' ⬅' : ''}</span>
                    <span class="leaderboard-score">${entry.score}</span>
                    <span class="leaderboard-streak"><span class="streak-emoji">🔥</span><span class="streak-num">${entry.streak}</span></span>
                </div>
            `).join('');
        }

        // Get a random Pokemon ID that hasn't been shown yet
        function getUnshownPokemonId() {
            // If all 150 have been shown, return null
            if (shownPokemonIds.size >= 150) {
                return null;
            }

            // Build array of available IDs (1-150 that haven't been shown)
            const availableIds = [];
            for (let i = 1; i <= 150; i++) {
                if (!shownPokemonIds.has(i)) {
                    availableIds.push(i);
                }
            }

            // Pick a random one from available
            const randomIndex = Math.floor(Math.random() * availableIds.length);
            return availableIds[randomIndex];
        }

        // Show congratulations screen when all Pokemon have been guessed
        function showCompletionScreen() {
            const img = document.getElementById('pokemonImage');
            const title = document.getElementById('questionTitle');
            const feedback = document.getElementById('feedback');
            const guessInput = document.getElementById('guessInput');

            // Hide the Pokemon image
            img.style.display = 'none';

            // Update title to congratulations
            title.innerHTML = '<span class="big-line">' + wrapLetters("ALL DONE!");

            // Show final stats in feedback
            const playerName = document.getElementById('playerName').value.trim() || 'Trainer';
            feedback.innerHTML = `
                <span class="feedback-title correct-title">All 150 Pokemon!</span>
                <br>
                Final Score: <strong>${score}</strong>
                <br>
                Best Streak: <strong>${maxStreak}</strong>
                <br><br>
                Well done, ${playerName}!
            `;
            feedback.className = 'feedback correct visible';

            // Disable input
            guessInput.disabled = true;
            guessInput.placeholder = 'Game Complete!';

            // Save final score to leaderboard
            if (score > 0 && playerName) {
                saveToLeaderboard(playerName, score, maxStreak);
            }
        }
        // Fetch a random Gen 1 Pokemon (IDs 1-150) - no repeats per session
        async function fetchRandomPokemon() {
            revealed = false;
            const randomId = getUnshownPokemonId();

            // Check if all Pokemon have been shown
            if (randomId === null) {
                showCompletionScreen();
                return;
            }

            shownPokemonIds.add(randomId); // Mark as shown

            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${randomId}`);
            const data = await response.json();

            const imageUrl = data.sprites.other['official-artwork'].front_default || data.sprites.front_default;

            // Preload the image before displaying
            await new Promise((resolve) => {
                const preloadImg = new Image();
                preloadImg.onload = resolve;
                preloadImg.onerror = resolve;
                preloadImg.src = imageUrl;
            });

            currentPokemon = {
                name: data.name,
                image: imageUrl,
                types: data.types.map(t => t.type.name),
                abilities: data.abilities.map(a => a.ability.name)
            };

            guessesRemaining = 3;
            displayPokemon();
        }

        function wrapLetters(text, priorityIndices = [], isAnswer = false) {
            return text.split('').map((char, index) => {
                if (char === ' ' || char === '\n') return char;
                const priority = priorityIndices.includes(index) ? 'priority' : 'no-priority';
                const answerClass = isAnswer ? 'answer-letter' : '';
                return `<span class="letter ${priority} ${answerClass}">${char}</span>`;
            }).join('');
        }

        function displayPokemon() {
            const img = document.getElementById('pokemonImage');
            const title = document.getElementById('questionTitle');

            // Reset and start with fade-in animation
            img.style.opacity = '';
            img.src = currentPokemon.image;
            img.className = 'pokemon-image silhouette fade-in';

            // Wrap letters with priority
            const line1 = wrapLetters("WHO'S", [0, 4]) + '<span class="question-mark">?</span>' + wrapLetters("THAT", [0]);
            const line2 = wrapLetters("PoKéMoN", [1, 3, 5]);
            title.innerHTML = line1 + '<br><span class="big-line">' + line2 + '</span>';

            document.getElementById('guessInput').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback'; // Hidden by default
            document.getElementById('guessInput').disabled = false;
            document.getElementById('guessInput').focus();

            // Play "Who's That Pokémon?" sound
            if (!isMuted) {
                const audio = document.getElementById('whosThatAudio');
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Audio play failed:', e));
            }
        }

        function playRevealSound() {
            if (!isMuted) {
                const audio = document.getElementById('revealAudio');
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Reveal audio play failed:', e));
            }
        }

        function submitGuess() {
            if (revealed) return;

            const guess = document.getElementById('guessInput').value.toLowerCase().trim();
            const feedback = document.getElementById('feedback');
            const img = document.getElementById('pokemonImage');

            if (!guess) {
                feedback.textContent = 'Please enter a Pokémon name!';
                feedback.className = 'feedback incorrect visible';
                return;
            }

            if (guess === currentPokemon.name.toLowerCase()) {
                const pointsEarned = guessesRemaining; // 3 points for first try, 2 for second, 1 for third
                score += pointsEarned;
                streak++;
                const pokemonNameCapitalized = currentPokemon.name.charAt(0).toUpperCase() + currentPokemon.name.slice(1);
                feedback.innerHTML = `<span class="feedback-title correct-title">Correct!</span><span class="points-earned">+${pointsEarned} point${pointsEarned > 1 ? 's' : ''}</span>`;
                feedback.className = 'feedback correct visible';
                img.className = 'pokemon-image reveal';
                playRevealSound();

                const line1 = wrapLetters("IT'S", [0], true);
                const pokemonName = currentPokemon.name.toUpperCase();
                // Give priority to vowels
                const priorityIndices = [];
                for (let i = 0; i < pokemonName.length; i++) {
                    if (['A', 'E', 'I', 'O', 'U'].includes(pokemonName[i])) {
                        priorityIndices.push(i);
                    }
                }
                const line2 = wrapLetters(pokemonName + "!", priorityIndices, true);
                document.getElementById('questionTitle').innerHTML = line1 + '<br><span class="big-line">' + line2 + '</span>';

                revealed = true;
                document.getElementById('guessInput').disabled = true;

                updateStats();

                gtag('event', 'pokemon_correct', {
                    event_category: 'game',
                    event_label: currentPokemon.name,
                    value: score
                });

                setTimeout(() => {
                    transitionToNextPokemon();
                }, 2000);
            } else {
                guessesRemaining--;

                if (guessesRemaining > 0) {
                    // Still have guesses left
                    if (guessesRemaining === 2) {
                        const typesHint = currentPokemon.types.join('  /  ');
                        feedback.innerHTML = `<span class="feedback-title">Wrong!</span><span class="hint-emoji">🤫</span> Type:  <strong>${typesHint}</strong><br><span class="guesses-left">(${guessesRemaining} guesses left)</span>`;
                    } else {
                        const abilitiesHint = currentPokemon.abilities.join('  /  ');
                        feedback.innerHTML = `<span class="feedback-title">Wrong!</span><span class="hint-emoji">🤫</span> Abilities:  <strong>${abilitiesHint}</strong><br><span class="guesses-left">(${guessesRemaining} guess left)</span>`;
                    }
                    feedback.className = 'feedback incorrect visible';
                } else {
                    // Out of guesses - reveal Pokemon
                    if (streak > 0) {
                        handleStreakBreak();
                    }
                    streak = 0;

                    const pokemonNameCapitalized = currentPokemon.name.charAt(0).toUpperCase() + currentPokemon.name.slice(1);
                    feedback.innerHTML = `<span class="feedback-title skipped-title">Out of guesses!</span><br>It was <strong>${pokemonNameCapitalized}</strong>`;
                    feedback.className = 'feedback skipped visible';
                    img.className = 'pokemon-image reveal';
                    playRevealSound();

                    const line1 = wrapLetters("IT'S", [0], true);
                    const pokemonName = currentPokemon.name.toUpperCase();
                    const priorityIndices = [];
                    for (let i = 0; i < pokemonName.length; i++) {
                        if (['A', 'E', 'I', 'O', 'U'].includes(pokemonName[i])) {
                            priorityIndices.push(i);
                        }
                    }
                    const line2 = wrapLetters(pokemonName + "!", priorityIndices, true);
                    document.getElementById('questionTitle').innerHTML = line1 + '<br><span class="big-line">' + line2 + '</span>';

                    revealed = true;
                    document.getElementById('guessInput').disabled = true;

                    setTimeout(() => {
                        transitionToNextPokemon();
                    }, 2000);
                }
                updateStats();
            }
        }

        function skipPokemon() {
            if (revealed) return;

            const feedback = document.getElementById('feedback');
            const img = document.getElementById('pokemonImage');

            const pokemonNameCapitalized = currentPokemon.name.charAt(0).toUpperCase() + currentPokemon.name.slice(1);
            feedback.innerHTML = `<span class="feedback-title skipped-title">Skipped!</span><br>It was <strong>${pokemonNameCapitalized}</strong>`;
            feedback.className = 'feedback skipped visible';
            img.className = 'pokemon-image reveal';
            playRevealSound();

            const line1 = wrapLetters("IT'S", [0], true);
            const pokemonName = currentPokemon.name.toUpperCase();
            // Give priority to vowels
            const priorityIndices = [];
            for (let i = 0; i < pokemonName.length; i++) {
                if (['A', 'E', 'I', 'O', 'U'].includes(pokemonName[i])) {
                    priorityIndices.push(i);
                }
            }
            const line2 = wrapLetters(pokemonName + "!", priorityIndices, true);
            document.getElementById('questionTitle').innerHTML = line1 + '<br><span class="big-line">' + line2 + '</span>';

            revealed = true;
            if (streak > 0) {
                handleStreakBreak();
            }
            streak = 0;
            document.getElementById('guessInput').disabled = true;

            gtag('event', 'pokemon_skip', {
                event_category: 'game',
                event_label: currentPokemon.name
            });

            updateStats();

            setTimeout(() => {
                transitionToNextPokemon();
            }, 2000);
        }

        function transitionToNextPokemon() {
            const img = document.getElementById('pokemonImage');
            img.className = 'pokemon-image fade-out';

            setTimeout(() => {
                // Keep image hidden while loading new one
                img.style.opacity = '0';
                fetchRandomPokemon();
            }, 400);
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
            document.getElementById('currentScore').textContent = score;
            document.getElementById('currentStreak').textContent = streak;

            // Track max streak
            if (streak > maxStreak) {
                maxStreak = streak;
            }

            // Update leaderboard to show current position
            renderLeaderboard();
        }

        function handleStreakBreak() {
            const playerName = document.getElementById('playerName').value.trim();
            if (score > 0 && playerName) {
                saveToLeaderboard(playerName, score, maxStreak);
            }
            // Reset for new game
            score = 0;
            maxStreak = 0;
        }

        function toggleMute() {
            isMuted = !isMuted;
            const button = document.getElementById('muteButton');
            const icon = document.getElementById('volumeIcon');
            const audio = document.getElementById('whosThatAudio');

            if (isMuted) {
                button.classList.add('muted');
                icon.className = 'fas fa-volume-mute';
                // Stop any currently playing audio
                audio.pause();
                audio.currentTime = 0;
            } else {
                button.classList.remove('muted');
                icon.className = 'fas fa-volume-up';
            }
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        async function startGame() {
            const overlay = document.getElementById('startOverlay');
            const gameContent = document.getElementById('gameContent');
            const playButton = overlay.querySelector('.play-button');

            // Change button to loading state
            playButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            playButton.disabled = true;

            // Fetch the first Pokemon before showing
            await fetchRandomPokemon();

            // Fade out overlay
            overlay.style.transition = 'opacity 0.4s ease';
            overlay.style.opacity = '0';

            // Show game content with fade in
            gameContent.style.display = 'flex';
            gameContent.style.opacity = '0';
            gameContent.style.transition = 'opacity 0.4s ease';

            setTimeout(() => {
                gameContent.style.opacity = '1';
                overlay.style.display = 'none';
            }, 50);
        }

        // Allow Enter key to submit
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('guessInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    submitGuess();
                }
            });

            // Initialize leaderboard
            renderLeaderboard();

            // Update leaderboard when player name or country changes
            document.getElementById('playerName').addEventListener('input', () => {
                renderLeaderboard();
            });
            document.getElementById('playerCountry').addEventListener('change', () => {
                renderLeaderboard();
            });

            // Show game UI (but wait for play button to start)
            document.getElementById('loading').style.display = 'none';
            document.getElementById('game').style.display = 'block';
        });
    </script>
    <script src="js/tracking.js"></script>
</body>

</html>
