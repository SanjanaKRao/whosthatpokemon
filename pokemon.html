    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Press+Start+2P&display=swap');

        @font-face {
            font-family: 'Pokemon Solid';
            src: url('css/Pokemon Solid.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #b51616;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(210, 92, 92, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
        }


        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 1000px;
            margin: 40px auto 40px;
        }

        .game-layout {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 30px;
            width: 100%;
        }

        .game-row {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 40px;
            width: 800px;
            height: 500px;
            padding: 40px;
            flex-shrink: 0;
        }

        .game-background {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 880px;
            height: 500px;
            border-radius: 15px;
            box-shadow:
                0 0 10px #ff6b00,
                0 0 20px #ff4500,
                0 0 30px #ff4500,
                0 0 40px #d32f2f;
            animation: fireBorder 2s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes fireBorder {
            0% {
                box-shadow:
                    0 0 10px #ff6b00,
                    0 0 20px #ff4500,
                    0 0 30px #ff4500,
                    0 0 40px #d32f2f;
            }
            100% {
                box-shadow:
                    0 0 15px #ffcb05,
                    0 0 30px #ff6b00,
                    0 0 45px #ff4500,
                    0 0 60px #d32f2f;
            }
        }

        .pokemon-display,
        .question-section {
            position: relative;
            z-index: 1;
        }

        .current-stats {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            justify-content: flex-start;
            width: 800px;
            padding-left: 50px;
        }

        .current-stat {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 12px 25px;
            border-radius: 12px;
            border: 2px solid #2152da;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .current-stat label {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        .current-stat .value {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 20px;
            color: #ffcb05;
            text-shadow: 2px 2px 0 #2152da;
        }

        .current-stat #playerName::placeholder {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 10px;
            color: #888;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .scoreboard {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 20px;
            width: 280px;
            height: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid #2152da;
            overflow-y: auto;
        }

        .scoreboard-title {
            font-family: 'Pokemon Solid', sans-serif;
            font-size: 24px;
            color: #ffcb05;
            -webkit-text-stroke: 2px #2152da;
            paint-order: stroke fill;
            text-align: center;
            margin: 0;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .leaderboard-entry {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            gap: 10px;
        }

        .leaderboard-entry.top-5 {
            background: rgba(255, 203, 5, 0.15);
            border: 1px solid rgba(255, 203, 5, 0.3);
        }

        .leaderboard-rank {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 10px;
            color: #ffcb05;
            width: 25px;
        }

        .leaderboard-flag {
            font-size: 16px;
            width: 22px;
            text-align: center;
        }

        .leaderboard-gen-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .leaderboard-name {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 11px;
            color: white;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .leaderboard-score {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 12px;
            color: #ffcb05;
        }

        .leaderboard-streak {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 12px;
            color: #ef5350;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .streak-emoji {
            font-size: 14px;
            position: relative;                                                             
            top: -2px;
        }

        .streak-num {
            line-height: 1;
            position: relative;
        }

        .no-scores {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 9px;
            color: #666;
            text-align: center;
            padding: 20px;
        }

        .leaderboard-entry.current-player {
            background: rgba(81, 207, 102, 0.25);
            border: 2px solid #51cf66;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(81, 207, 102, 0.3); }
            50% { box-shadow: 0 0 15px rgba(81, 207, 102, 0.6); }
        }

        .question-section {
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: -10px;
            flex-shrink: 0;
        }

        .title {
            font-family: 'Pokemon Solid', sans-serif;
            font-size: 48px;
            margin: 0;
            text-align: center;
            line-height: 1.5;
            letter-spacing: 2px;
            display: inline-block;
        }

        .letter {
            display: inline-block;
            position: relative;
            color: #d6af12;
            -webkit-text-stroke: 10px #2152da;
            paint-order: stroke fill;
            text-shadow: 8px 8px 0 rgba(0,0,0,0.25);
        }

        .letter.priority {
            z-index: 2;
        }

        .letter.no-priority {
            z-index: 1;
        }

        .answer-letter {
            -webkit-text-stroke: 4px #2152da;
        }

        .big-line {
            font-size: 60px;
        }

        .question-mark {
            display: inline-block;
             /* elongation */
            transform-origin: bottom;
            position: relative;
            color: #d6af12;
            -webkit-text-stroke: 10px #2152da;
            transform: scaleX(1) scaleY(3) skewX(8deg);
            font-size: 65px;
            margin: 0 5px 0 20px;
            top: 35px;
            font-family: 'BankGothic', sans-serif;
            text-shadow: 8px 8px 0 rgba(0,0,0,0.25);
            paint-order: stroke fill;
        }

        @font-face {
        font-family: 'BankGothic';
        src: url('./css/bank\ gothic\ medium\ bt.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
        }
        

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            font-size: 20px;
            color: white;
            font-weight: bold;
        }

        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .pokemon-display {
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-shrink: 0;
            margin-left: -30px;
        }

        .pokemon-image-container {
            width: 350px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .pokemon-image {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            transition: filter 0.3s ease, transform 0.4s ease, opacity 0.4s ease;
            opacity: 1;
            transform: scale(1);
        }

        .pokemon-image.silhouette {
            filter: brightness(0);
        }

        .pokemon-image.fade-out {
            opacity: 0;
            transform: scale(0.8) rotate(10deg);
        }

        .pokemon-image.fade-in {
            animation: pokemonAppear 0.5s ease-out forwards;
        }

        @keyframes pokemonAppear {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-10deg);
            }
            50% {
                transform: scale(1.1) rotate(5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .pokemon-image.reveal {
            animation: pokemonReveal 0.6s ease-out forwards;
        }

        @keyframes pokemonReveal {
            0% {
                filter: brightness(0);
                transform: scale(1);
            }
            50% {
                filter: brightness(1.5);
                transform: scale(1.15);
            }
            100% {
                filter: brightness(1);
                transform: scale(1);
            }
        }

        .guess-section {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 15px;
            margin-left: 180px;
        }

        .guess-controls {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .guess-input {
            width: 250px;
            padding: 12px 15px;
            font-size: 10px;
            border: 3px solid #3d7dca;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: 'Press Start 2P', sans-serif;
        }

        .guess-input:focus {
            outline: none;
            border-color: #ffcb05;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 25px;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }

        .btn-submit {
            background: #ffcb05;
            color: #2152da;
        }

        .btn-skip {
            background: #ff6b6b;
            color: white;
        }

        .feedback {
            padding: 20px 25px;
            border-radius: 12px;
            font-size: 10px;
            font-family: 'Press Start 2P', sans-serif;
            text-align: center;
            min-height: 100px;
            width: 280px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid transparent;
            transition: all 0.3s ease;
            line-height: 1.5;
        }

        .feedback.visible {
            display: flex;
            flex-direction: column;
        }

        .feedback-title {
            font-size: 20px;
            font-weight: bold;
            color: #ff4444;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .feedback-title.correct-title {
            color: #ffffff;
        }

        .feedback.correct .points-earned {
            color: #fff;
        }

        .feedback-title.skipped-title {
            color: #adb5bd;
        }

        .feedback strong {
            color: #ffcb05;
            text-transform: capitalize;
            letter-spacing: 1px;
            font-size: 22px;
        }

        .guesses-left {
            font-size: 15px;
            color: #aaa;
            margin-top: 8px;
        }

        .hint-emoji {
            font-size: 50px;
            vertical-align: middle;
            margin-right: 5px;
        }

        .points-earned {
            font-size: 18px;
            font-weight: bold;
            color: #ffcb05;
            margin-top: 5px;
        }

        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .start-content {
            text-align: center;
        }

        .start-title {
            font-family: 'Pokemon Solid', sans-serif;
            font-size: 48px;
            color: #d6af12;
            -webkit-text-stroke: 10px #2152da;
            paint-order: stroke fill;
            text-shadow: 8px 8px 0 rgba(0,0,0,0.25);
            margin-bottom: 18px;
            line-height: 1.5;
            letter-spacing: 2px;
        }

        .play-button {
            background: linear-gradient(135deg, #ffcb05 0%, #f0b800 100%);
            color: #2152da;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 16px;
            padding: 18px 40px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b8860b, 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .play-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #b8860b, 0 15px 25px rgba(0,0,0,0.3);
        }

        .play-button:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b8860b, 0 5px 10px rgba(0,0,0,0.3);
        }

        .play-button i {
            margin-right: 10px;
        }

        .start-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .generation-picker {
            width: 700px;
            height : 200px;
            background: rgba(13, 27, 42, 0.9);
            border: 0.5px solid #2152da;
            border-radius: 8px;
            padding: 22px 20px 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        .generation-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
            color: #ffcb05;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 10px;
            text-transform: uppercase;
        }

        .generation-label i {
            font-size: 16px;
        }

        .generation-dropdown {
            position: relative;
        }

        .generation-trigger {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 3px solid #3d7dca;
            background: #fff8dc;
            color: #1a1a2e;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 9px;
            box-sizing: border-box;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
        }

        .generation-trigger:focus {
            outline: none;
            border-color: #ffcb05;
        }

        .generation-trigger-label {
            flex: 1;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .generation-caret {
            color: #2152da;
            transition: transform 0.2s ease;
        }

        .generation-dropdown.open .generation-caret {
            transform: rotate(180deg);
        }

        .generation-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            background: #fff8dc;
            border: 3px solid #3d7dca;
            border-radius: 14px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            padding: 12px;
        }

        .generation-menu[hidden] {
            display: none;
        }

        .generation-option {
            width: 100%;
            border: 2px solid rgba(33, 82, 218, 0.18);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.45);
            color: #1a1a2e;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 8px;
            line-height: 1.5;
            text-align: left;
            padding: 14px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .generation-option-all {
            grid-column: 1 / -1;
        }

        .generation-option:hover,
        .generation-option:focus {
            outline: none;
            background: #ffe082;
            border-color: rgba(33, 82, 218, 0.35);
        }

        .generation-option.selected {
            background: #ffcb05;
            color: #2152da;
        }

        .generation-option-copy {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .generation-option-text {
            line-height: 1.5;
        }

        .generation-option-all .generation-option-copy {
            justify-content: center;
        }

        .generation-icon-image {
            width: 50px;
            height: 50px;
            object-fit: contain;
            image-rendering: auto;
            flex-shrink: 0;
        }

        .generation-icon-fallback {
            width: 50px;
            height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 22px;
            line-height: 1;
        }

        .generation-actions {
            display: flex;
            flex-direction: column;
            margin-top: 18px;
        }

        .overlay-error {
            min-height: 18px;
            margin-top: 12px;
            color: #ff8a80;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 9px;
            line-height: 1.6;
        }

        .game-content {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
            color: white;
            border-color: #2f9e44;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            border-color: #2152da;
        }

        .feedback.skipped {
            background: linear-gradient(135deg, #495057 0%, #343a40 100%);
            color: white;
            border-color: #6c757d;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 24px;
            font-family: 'Press Start 2P', sans-serif;
        }

        .mute-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .mute-button:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .mute-button.muted {
            background: rgba(255, 107, 107, 0.5);
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 84px 16px 28px;
                margin: 0 auto 28px;
                max-width: none;
                width: 100%;
                box-sizing: border-box;
            }

            #game,
            .game-layout,
            .game-row,
            .current-stats,
            .guess-section,
            .right-column,
            .scoreboard,
            .feedback,
            .generation-picker {
                width: 100%;
                box-sizing: border-box;
            }

            .game-layout {
                flex-direction: column;
                align-items: center;
            }

            .current-stats {
                flex-wrap: wrap;
                gap: 12px;
                margin-bottom: 20px;
                justify-content: center;
                padding-left: 0;
            }

            .current-stat {
                flex: 1 1 calc(50% - 6px);
                padding: 12px 16px;
                justify-content: center;
                min-width: 0;
            }

            .current-stat label {
                font-size: 9px;
            }

            .current-stat .value {
                font-size: 18px;
            }

            #playerName {
                width: 100%;
                font-size: 11px;
                min-width: 0;
            }

            #playerCountry {
                min-width: 56px;
            }

            #playerCountry,
            #playerName {
                background: transparent;
                border: none;
                color: #ffcb05;
                outline: none;
            }

            #playerName,
            .guess-input,
            .generation-trigger,

<body>

    <audio id="whosThatAudio" preload="auto">

    </audio>

    <audio id="revealAudio" preload="auto">
        <source src="assets/pokeball_openingv3.mp3" type="audio/mpeg">
    </audio>

    <script>
        let currentPokemon = null;
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let revealed = false;
        let isMuted = false;
        let guessesRemaining = 3;
        let leaderboardEntries = [];
        let lastLeaderboardSyncSnapshot = null;
        let currentLeaderboardRecordId = null;
        let leaderboardSyncChain = Promise.resolve();
        let generationOptions = [];
        let currentGenerationKey = '';
        let currentGenerationLabel = '';
        let currentGenerationIconUrl = '';
        let currentGenerationTotal = 0;
        let pokemonSeenCount = 0;
        let selectedGenerationKey = '';
        const generationRangeByKey = {
            gen1: '1-151',
            gen2: '152-251',
            gen3: '252-386',
            gen4: '387-493',
            gen5: '494-649',
            gen6: '650-721',
            gen7: '722-809',
            gen8: '810-905',
            gen9: '906-1025',
            all: '1-1025'
        };

        function trackEvent(eventName, params = {}) {
            if (!window.tracking) {
                return;
            }

            window.tracking.track(eventName, params);
        }

        function getPlayerNameForSave() {
            return document.getElementById('playerName').value.trim() || 'You';
        }

        function setGenerationError(message = '') {
            document.getElementById('generationError').textContent = message;
        }

        function createGenerationIconElement(option) {
            if (option.icon_url) {
                const image = document.createElement('img');
                image.className = 'generation-icon-image';
                image.src = option.icon_url;
                image.alt = option.key === 'all'
                    ? `${option.label} icon`
                    : option.icon_pokemon_name
                        ? `${option.icon_pokemon_name} icon`
                        : `${option.label} icon`;
                return image;
            }

            const fallback = document.createElement('span');
            fallback.className = 'generation-icon-fallback';
            fallback.textContent = option.fallback_icon || '•';
            fallback.setAttribute('aria-hidden', 'true');
            return fallback;
        }

        function buildGenerationText(option) {
            const resolvedRange = option.id_range
                || generationRangeByKey[option.key]
                || (
                    option.start_id !== undefined && option.end_id !== undefined
                        ? `${option.start_id}-${option.end_id}`
                        : null
                )
                || `${option.total_count || '?'}`;
            return `${option.label} (${resolvedRange})`;
        }

        function getSelectedGenerationOption() {
            return generationOptions.find((option) => option.key === selectedGenerationKey) || null;
        }

        function populateGenerationOptions() {
            const menu = document.getElementById('generationMenu');
            menu.innerHTML = '';

            generationOptions.forEach((option) => {
                const optionButton = document.createElement('button');
                optionButton.type = 'button';
                optionButton.className = option.key === 'all'
                    ? 'generation-option generation-option-all'
                    : 'generation-option';
                optionButton.dataset.value = option.key;

                const optionCopy = document.createElement('span');
                optionCopy.className = 'generation-option-copy';
                optionCopy.appendChild(createGenerationIconElement(option));

                const optionText = document.createElement('span');
                optionText.className = 'generation-option-text';
                optionText.textContent = buildGenerationText(option);
                optionCopy.appendChild(optionText);

                optionButton.appendChild(optionCopy);
                optionButton.addEventListener('click', () => {
                    selectGenerationOption(option.key);
                });
                menu.appendChild(optionButton);
            });

            renderGenerationSelection();
        }

        function renderGenerationSelection() {
            const triggerLabel = document.getElementById('generationTriggerLabel');
            const selectedOption = generationOptions.find((option) => option.key === selectedGenerationKey);
            triggerLabel.innerHTML = '';

            if (selectedOption) {
                triggerLabel.appendChild(createGenerationIconElement(selectedOption));
                const selectedText = document.createElement('span');
                selectedText.textContent = buildGenerationText(selectedOption);
                triggerLabel.appendChild(selectedText);
            } else {
                triggerLabel.textContent = 'Select a generation';
            }

            document.querySelectorAll('.generation-option').forEach((optionButton) => {
                optionButton.classList.toggle('selected', optionButton.dataset.value === selectedGenerationKey);
            });
        }

        function toggleGenerationMenu() {
            const dropdown = document.getElementById('generationDropdown');
            const menu = document.getElementById('generationMenu');
            const trigger = document.getElementById('generationTrigger');
            const isOpen = !menu.hidden;

            menu.hidden = isOpen;
            dropdown.classList.toggle('open', !isOpen);
            trigger.setAttribute('aria-expanded', String(!isOpen));
        }

        function closeGenerationMenu() {
            const dropdown = document.getElementById('generationDropdown');
            const menu = document.getElementById('generationMenu');
            const trigger = document.getElementById('generationTrigger');

            menu.hidden = true;
            dropdown.classList.remove('open');
            trigger.setAttribute('aria-expanded', 'false');
        }

        function selectGenerationOption(generationKey) {
            selectedGenerationKey = generationKey;
            renderGenerationSelection();
            closeGenerationMenu();
            setGenerationError('');
        }

        async function fetchGenerationOptions() {
            const response = await fetch('/api/generations');
            if (!response.ok) {
                throw new Error(`Generation request failed with status ${response.status}`);
            }

            const data = await response.json();
            generationOptions = Array.isArray(data.options) ? data.options : [];
            populateGenerationOptions();
        }

        function showGenerationPicker() {
            const picker = document.getElementById('generationPicker');
            if (generationOptions.length === 0) {
                setGenerationError('Generation data is still loading.');
                return;
            }

            document.getElementById('playButton').hidden = true;
            picker.hidden = false;
            setGenerationError('');
            document.getElementById('generationTrigger').focus();
        }

        function applySessionState(sessionState) {
            const generation = sessionState.generation || {};
            currentGenerationKey = generation.key || '';
            currentGenerationLabel = generation.display_label || generation.label || '';
            currentGenerationIconUrl = generation.icon_url || currentGenerationIconUrl || '';
            currentGenerationTotal = Number(sessionState.total_count) || 0;
            pokemonSeenCount = Number(sessionState.seen_count) || 0;
        }

        // Leaderboard functions
        async function fetchLeaderboardFromServer() {
            try {
                const response = await fetch('/api/leaderboard?limit=5');
                if (!response.ok) {
                    throw new Error(`Leaderboard request failed with status ${response.status}`);
                }

                const data = await response.json();
                leaderboardEntries = Array.isArray(data.entries) ? data.entries : [];
            } catch (error) {
                console.error('Failed to load leaderboard:', error);
                leaderboardEntries = [];
            }

            renderLeaderboard();
        }

        // queues leaderboard syncs so updates don’t race
        async function syncLeaderboardToServer(name, playerScore, playerStreak) {
            if (!name || playerScore === 0) return;

            const syncTask = leaderboardSyncChain.then(() => sendLeaderboardSync(name, playerScore, playerStreak));
            leaderboardSyncChain = syncTask.catch(() => {});
            return syncTask;
        }

        async function sendLeaderboardSync(name, playerScore, playerStreak) {
            const country = document.getElementById('playerCountry').value || '🌍';
            const selectedOption = getSelectedGenerationOption();
            const generationIconUrl = currentGenerationIconUrl || (selectedOption ? (selectedOption.icon_url || '') : '');
            const snapshotKey = `${currentLeaderboardRecordId || 'new'}|${name}|${country}|${playerScore}|${playerStreak}|${generationIconUrl}`;
            if (lastLeaderboardSyncSnapshot === snapshotKey) {
                return;
            }

            try {
                const response = await fetch('/api/leaderboard', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: currentLeaderboardRecordId ? Number(currentLeaderboardRecordId) : undefined,
                        name,
                        country,
                        score: playerScore,
                        streak: playerStreak,
                        generation_icon_url: generationIconUrl
                    })
                });

                if (!response.ok) {
                    throw new Error(`Leaderboard save failed with status ${response.status}`);
                }

                const data = await response.json();
                if (data.entry && data.entry.id) {
                    currentLeaderboardRecordId = String(data.entry.id);
                }
                lastLeaderboardSyncSnapshot = `${currentLeaderboardRecordId || 'new'}|${name}|${country}|${playerScore}|${playerStreak}|${generationIconUrl}`;
                await fetchLeaderboardFromServer();

                trackEvent('leaderboard_saved', {
                    score: playerScore,
                    streak: playerStreak,
                    leaderboard_size: leaderboardEntries.length
                });
            } catch (error) {
                console.error('Failed to save leaderboard score:', error);
                throw error;
            }
        }

        async function syncCurrentPlayerLeaderboardState() {
            if (score <= 0) {
                return;
            }

            await syncLeaderboardToServer(getPlayerNameForSave(), score, streak);
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboardList');
            const displayList = leaderboardEntries.map((entry) => ({
                ...entry,
                isCurrent: currentLeaderboardRecordId !== null && String(entry.id) === String(currentLeaderboardRecordId)
            }));

            if (displayList.length === 0) {
                container.innerHTML = '<div class="no-scores">No scores yet!</div>';
                return;
            }

            container.innerHTML = displayList.map((entry, index) => `
                <div class="leaderboard-entry ${index < 3 ? 'top-3' : ''} ${entry.isCurrent ? 'current-player' : ''}">
                    <span class="leaderboard-rank">${index + 1}.</span>
                    <span class="leaderboard-flag">${entry.country || '🌍'}</span>
                    <span class="leaderboard-name">${entry.name}${entry.isCurrent ? ' ⬅' : ''}</span>
                    <span class="leaderboard-score">${entry.score}</span>
                    <span class="leaderboard-streak"><span class="streak-emoji">🔥</span><span class="streak-num">${entry.streak}</span></span>
                    ${entry.generation_icon_url ? `<img class="leaderboard-gen-icon" src="${entry.generation_icon_url}" alt="Generation icon">` : ''}
                </div>
            `).join('');
        }

        function showCompletionScreen() {
            const img = document.getElementById('pokemonImage');
            const title = document.getElementById('questionTitle');
            const feedback = document.getElementById('feedback');
            const guessInput = document.getElementById('guessInput');

            // Hide the Pokemon image
            img.style.display = 'none';

            // Update title to congratulations
            title.innerHTML = '<span class="big-line">' + wrapLetters("ALL DONE!");

            // Show final stats in feedback
            const playerName = document.getElementById('playerName').value.trim() || 'You';
            const playerNameForSave = getPlayerNameForSave();
            feedback.innerHTML = `
                <span class="feedback-title correct-title">${currentGenerationLabel || 'Selected Pokédex'} cleared!</span>
                <br>
                Final Score: <strong>${score}</strong>
                <br>
                Best Streak: <strong>${maxStreak}</strong>
                <br>
                Pokemon Seen: <strong>${pokemonSeenCount}/${currentGenerationTotal || pokemonSeenCount}</strong>
                <br><br>
                Well done, ${playerName}!
            `;
            feedback.className = 'feedback correct visible';

            // Disable input
            guessInput.disabled = true;
            guessInput.placeholder = 'Game Complete!';

            // Save final score to leaderboard
            if (score > 0 && playerNameForSave) {
                void syncLeaderboardToServer(playerNameForSave, score, maxStreak);
            }

            trackEvent('game_completed', {
                final_score: score,
                best_streak: maxStreak,
                pokemon_seen: pokemonSeenCount,
                generation: currentGenerationKey
            });
        }

        async function fetchRandomPokemon() {
            revealed = false;
            const sessionResponse = await fetch('/api/game/pokemon');
            if (!sessionResponse.ok) {
                throw new Error(`Game session request failed with status ${sessionResponse.status}`);
            }

            const sessionState = await sessionResponse.json();
            applySessionState(sessionState);

            if (sessionState.completed || !sessionState.pokemon_id) {
                showCompletionScreen();
                return;
            }

            const randomId = Number(sessionState.pokemon_id);

            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${randomId}`);
            const data = await response.json();

            const imageUrl = data.sprites.other['official-artwork'].front_default || data.sprites.front_default;

            // Preload the image before displaying
            await new Promise((resolve) => {
                const preloadImg = new Image();
                preloadImg.onload = resolve;
                preloadImg.onerror = resolve;
                preloadImg.src = imageUrl;
            });

            currentPokemon = {
                name: data.name,
                image: imageUrl,
                types: data.types.map(t => t.type.name),
                abilities: data.abilities.map(a => a.ability.name)
            };

            guessesRemaining = 3;
            trackEvent('pokemon_loaded', {
                pokemon_number: randomId,
                pokemon_seen: pokemonSeenCount,
                generation: currentGenerationKey
            });
            displayPokemon();
        }

        function wrapLetters(text, priorityIndices = [], isAnswer = false) {
            return text.split('').map((char, index) => {
                if (char === ' ' || char === '\n') return char;
                const priority = priorityIndices.includes(index) ? 'priority' : 'no-priority';
                const answerClass = isAnswer ? 'answer-letter' : '';
                return `<span class="letter ${priority} ${answerClass}">${char}</span>`;
            }).join('');
        }

        function displayPokemon() {
            const img = document.getElementById('pokemonImage');
            const title = document.getElementById('questionTitle');

            // Reset and start with fade-in animation
            img.style.opacity = '';
            img.src = currentPokemon.image;
            img.className = 'pokemon-image silhouette fade-in';

            // Wrap letters with priority
            const line1 = wrapLetters("WHO'S", [0, 4]) + '<span class="question-mark">?</span>' + wrapLetters("THAT", [0]);
            const line2 = wrapLetters("PoKéMoN", [1, 3, 5]);
            title.innerHTML = line1 + '<br><span class="big-line">' + line2 + '</span>';

            document.getElementById('guessInput').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback'; // Hidden by default
            document.getElementById('guessInput').disabled = false;
            document.getElementById('guessInput').focus();

            // Play "Who's That Pokémon?" sound
            if (!isMuted) {
                const audio = document.getElementById('whosThatAudio');
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Audio play failed:', e));
            }
        }

        function playRevealSound() {
            if (!isMuted) {
                const audio = document.getElementById('revealAudio');
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Reveal audio play failed:', e));
            }
        }

        async function submitGuess() {
            if (revealed) return;

            const guess = document.getElementById('guessInput').value.toLowerCase().trim();
            const feedback = document.getElementById('feedback');
            const img = document.getElementById('pokemonImage');

            if (!guess) {
                feedback.textContent = 'Please enter a Pokémon name!';
                feedback.className = 'feedback incorrect visible';
                return;
            }

            trackEvent('guess_submitted', {
                attempt_number: 4 - guessesRemaining,
                guess_length: guess.length
            });

            if (guess === currentPokemon.name.toLowerCase()) {
                const pointsEarned = guessesRemaining; // 3 points for first try, 2 for second, 1 for third
                score += pointsEarned;
                streak++;
                feedback.innerHTML = `<span class="feedback-title correct-title">Correct!</span><span class="points-earned">+${pointsEarned} point${pointsEarned > 1 ? 's' : ''}</span>`;
                feedback.className = 'feedback correct visible';
                img.className = 'pokemon-image reveal';
                playRevealSound();

                const line1 = wrapLetters("IT'S", [0], true);
                const pokemonName = currentPokemon.name.toUpperCase();
                // Give priority to vowels
                const priorityIndices = [];
                for (let i = 0; i < pokemonName.length; i++) {
                    if (['A', 'E', 'I', 'O', 'U'].includes(pokemonName[i])) {
                        priorityIndices.push(i);
                    }
                }
                const line2 = wrapLetters(pokemonName + "!", priorityIndices, true);
                document.getElementById('questionTitle').innerHTML = line1 + '<br><span class="big-line">' + line2 + '</span>';

                revealed = true;
                document.getElementById('guessInput').disabled = true;

                updateStats();
                await syncLeaderboardToServer(getPlayerNameForSave(), score, streak);

                trackEvent('pokemon_correct', {
                    pokemon_name: currentPokemon.name,
                    points_earned: pointsEarned,
                    score: score,
                    streak: streak
                });

                setTimeout(() => {
                    transitionToNextPokemon();
                }, 2000);
            } else {
                guessesRemaining--;

                if (guessesRemaining > 0) {
                    // Still have guesses left
                    if (guessesRemaining === 2) {
                        const typesHint = currentPokemon.types.join('  /  ');
                        feedback.innerHTML = `<span class="feedback-title">Wrong!</span><span class="hint-emoji">🤫</span> Type:  <strong>${typesHint}</strong><br><span class="guesses-left">(${guessesRemaining} guesses left)</span>`;
                    } else {
                        const abilitiesHint = currentPokemon.abilities.join('  /  ');
                        feedback.innerHTML = `<span class="feedback-title">Wrong!</span><span class="hint-emoji">🤫</span> Abilities:  <strong>${abilitiesHint}</strong><br><span class="guesses-left">(${guessesRemaining} guess left)</span>`;
                    }
                    feedback.className = 'feedback incorrect visible';

                    trackEvent('pokemon_incorrect', {
                        pokemon_name: currentPokemon.name,
                        guesses_remaining: guessesRemaining
                    });
                } else {
                    // Out of guesses - reveal Pokemon
                    if (streak > 0) {
                        streak = 0;
                        await handleStreakBreak();
                    }

                    const pokemonNameCapitalized = currentPokemon.name.charAt(0).toUpperCase() + currentPokemon.name.slice(1);
                    feedback.innerHTML = `<span class="feedback-title skipped-title">Out of guesses!</span><br>It was <strong>${pokemonNameCapitalized}</strong>`;
                    feedback.className = 'feedback skipped visible';
                    img.className = 'pokemon-image reveal';
                    playRevealSound();

                    const line1 = wrapLetters("IT'S", [0], true);
                    const pokemonName = currentPokemon.name.toUpperCase();
                    const priorityIndices = [];
                    for (let i = 0; i < pokemonName.length; i++) {
                        if (['A', 'E', 'I', 'O', 'U'].includes(pokemonName[i])) {
                            priorityIndices.push(i);
                        }
                    }
                    const line2 = wrapLetters(pokemonName + "!", priorityIndices, true);
                    document.getElementById('questionTitle').innerHTML = line1 + '<br><span class="big-line">' + line2 + '</span>';

                    revealed = true;
                    document.getElementById('guessInput').disabled = true;

                    trackEvent('pokemon_missed', {
                        pokemon_name: currentPokemon.name
                    });

                    setTimeout(() => {
                        transitionToNextPokemon();
                    }, 2000);
                }
                updateStats();
            }
        }

        async function skipPokemon() {
            if (revealed) return;

            const feedback = document.getElementById('feedback');
            const img = document.getElementById('pokemonImage');

            const pokemonNameCapitalized = currentPokemon.name.charAt(0).toUpperCase() + currentPokemon.name.slice(1);
            feedback.innerHTML = `<span class="feedback-title skipped-title">Skipped!</span><br>It was <strong>${pokemonNameCapitalized}</strong>`;
            feedback.className = 'feedback skipped visible';
            img.className = 'pokemon-image reveal';
            playRevealSound();

            const line1 = wrapLetters("IT'S", [0], true);
            const pokemonName = currentPokemon.name.toUpperCase();
            // Give priority to vowels
            const priorityIndices = [];
            for (let i = 0; i < pokemonName.length; i++) {
                if (['A', 'E', 'I', 'O', 'U'].includes(pokemonName[i])) {
                    priorityIndices.push(i);
                }
            }
            const line2 = wrapLetters(pokemonName + "!", priorityIndices, true);
            document.getElementById('questionTitle').innerHTML = line1 + '<br><span class="big-line">' + line2 + '</span>';

            revealed = true;
            if (streak > 0) {
                streak = 0;
                await handleStreakBreak();
            }
            document.getElementById('guessInput').disabled = true;

            trackEvent('pokemon_skip', {
                pokemon_name: currentPokemon.name,
                score: score
            });

            updateStats();

            setTimeout(() => {
                transitionToNextPokemon();
            }, 2000);
        }

        function transitionToNextPokemon() {
            const img = document.getElementById('pokemonImage');
            img.className = 'pokemon-image fade-out';

            setTimeout(() => {
                // Keep image hidden while loading new one
                img.style.opacity = '0';
                fetchRandomPokemon();
            }, 400);
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
            document.getElementById('currentScore').textContent = score;
            document.getElementById('currentStreak').textContent = streak;

            // Track max streak
            if (streak > maxStreak) {
                maxStreak = streak;
            }

            // Update leaderboard to show current position
            renderLeaderboard();
        }

        async function handleStreakBreak() {
            const playerName = getPlayerNameForSave();
            const streakBeforeReset = maxStreak;
            const scoreBeforeReset = score;
            if (score > 0 && playerName) {
                await syncLeaderboardToServer(playerName, score, streak);
            }

            trackEvent('streak_broken', {
                score: scoreBeforeReset,
                best_streak: streakBeforeReset
            });
        }

        function toggleMute() {
            isMuted = !isMuted;
            const button = document.getElementById('muteButton');
            const icon = document.getElementById('volumeIcon');
            const audio = document.getElementById('whosThatAudio');

            if (isMuted) {
                button.classList.add('muted');
                icon.className = 'fas fa-volume-mute';
                // Stop any currently playing audio
                audio.pause();
                audio.currentTime = 0;
            } else {
                button.classList.remove('muted');
                icon.className = 'fas fa-volume-up';
            }

            trackEvent('audio_toggled', {
                muted: isMuted
            });
        }

        function resetGameState() {
            currentPokemon = null;
            score = 0;
            streak = 0;
            maxStreak = 0;
            revealed = false;
            guessesRemaining = 3;
            pokemonSeenCount = 0;
            updateStats();
        }

        async function startGame() {
            const overlay = document.getElementById('startOverlay');
            const gameContent = document.getElementById('gameContent');
            const startRoundButton = document.getElementById('startRoundButton');
            const selectedGeneration = selectedGenerationKey.trim();

            if (!selectedGeneration) {
                setGenerationError('Choose a generation first.');
                return;
            }

            setGenerationError('');
            startRoundButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            startRoundButton.disabled = true;

            try {
                const selectedOption = getSelectedGenerationOption();
                currentGenerationIconUrl = selectedOption ? (selectedOption.icon_url || '') : '';
                const response = await fetch('/api/game/session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        generation: selectedGeneration,
                        generationIconUrl: selectedOption ? (selectedOption.icon_url || '') : ''
                    })
                });

                if (!response.ok) {
                    throw new Error(`Session start failed with status ${response.status}`);
                }

                const sessionState = await response.json();
                applySessionState(sessionState);
                resetGameState();
                await fetchRandomPokemon();

                trackEvent('game_started', {
                    generation: currentGenerationKey
                });

                overlay.style.transition = 'opacity 0.4s ease';
                overlay.style.opacity = '0';

                gameContent.style.display = 'flex';
                gameContent.style.opacity = '0';
                gameContent.style.transition = 'opacity 0.4s ease';

                setTimeout(() => {
                    gameContent.style.opacity = '1';
                    overlay.style.display = 'none';
                }, 50);
            } catch (error) {
                console.error('Failed to start game session:', error);
                setGenerationError('Could not start this generation. Try again.');
                startRoundButton.disabled = false;
                startRoundButton.innerHTML = '<i class="fas fa-bolt"></i> Start Round';
                return;
            }

            startRoundButton.disabled = false;
            startRoundButton.innerHTML = '<i class="fas fa-bolt"></i> Start Round';
        }

        // Allow Enter key to submit
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('guessInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    submitGuess();
                }
            });

            document.addEventListener('click', (event) => {
                const dropdown = document.getElementById('generationDropdown');
                if (dropdown && !dropdown.contains(event.target)) {
                    closeGenerationMenu();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeGenerationMenu();
                }
            });

            try {
                await Promise.all([
                    fetchLeaderboardFromServer(),
                    fetchGenerationOptions()
                ]);
            } catch (error) {
                console.error('Failed to initialize game data:', error);
                setGenerationError('Could not load generations. Refresh and try again.');
            }

            // Update leaderboard when player name or country changes
            document.getElementById('playerName').addEventListener('input', () => {
                void syncCurrentPlayerLeaderboardState();
            });
            document.getElementById('playerCountry').addEventListener('change', () => {
                void syncCurrentPlayerLeaderboardState();
            });

            // Show game UI (but wait for play button to start)
            document.getElementById('loading').style.display = 'none';
            document.getElementById('game').style.display = 'block';
        });
    </script>
</body>

</html>
